
services:
  notification-stub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-stub
    ports:
      - "8080:8080"
    environment:
      MAX_STORAGE_SIZE: "0"
      CLEANUP_INTERVAL_SECONDS: "600"
      RETENTION_PERIOD_SECONDS: "3600"
      AUTO_CLEANUP_ENABLED: "true"
      ASPNETCORE_HTTP_PORTS: "8080"
    restart: unless-stopped
