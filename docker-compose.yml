version: '3.8'

services:
  notification-stub:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MAX_STORAGE_SIZE=100
      - CLEANUP_INTERVAL_SECONDS=600
      - RETENTION_PERIOD_SECONDS=3600
      - AUTO_CLEANUP_ENABLED=true
      - ASPNETCORE_URLS=http://+:8080
    restart: always